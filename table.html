<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self'; script-src 'self'; connect-src 'self' data: blob:; font-src 'self'; object-src 'none'; base-uri 'self'">
  <title>Экран стола</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css?v=9">
</head>
<body class="table">
  <main class="stage table-stage" id="stage">
    <div class="board" id="board" hidden>
      <img class="map" id="mapImage" alt="">
      <video class="map" id="mapVideo" hidden muted loop playsinline></video>
      <canvas class="plan-layer floor-layer" id="floorLayer"></canvas>
      <div class="token-layer back-layer" id="backLayer"></div>
      <canvas class="grid-layer" id="gridLayer"></canvas>
      <canvas class="plan-layer" id="planLayer"></canvas>
      <div class="token-layer" id="tokenLayer"></div>
      <canvas class="draw-layer" id="drawLayer"></canvas>
      <canvas class="fog-layer solid" id="fogLayer"></canvas>
      <canvas class="shape-layer" id="shapeLayer"></canvas>
      <div class="marker-layer" id="markerLayer"></div>
      <p class="fa-credit" id="faCredit" hidden>Элементы: <a href="https://www.forgotten-adventures.net/" target="_blank" rel="noopener">Forgotten Adventures</a></p>
    </div>
    <div class="turn-banner" id="turnBanner" hidden></div>
    <div class="table-card" id="tableCard" hidden></div>
    <div class="blackout" id="blackout" hidden></div>
  </main>
  <button class="fs-hint" id="fsHint" type="button"><span>Нажмите, чтобы развернуть на весь экран</span></button>
  <script src="js/db.js?v=9"></script>
  <script src="js/bus.js?v=9"></script>
  <script src="js/paint.js?v=9"></script>
  <script src="js/media.js?v=9"></script>
  <script src="js/play.js?v=9"></script>
  <script src="js/table.js?v=9"></script>
</body>
</html>
